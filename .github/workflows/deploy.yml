name: DigitalOcean'ga deploy

# main branch'ga har push qilinganda server avtomatik yangilanadi.
# GitHub sahifasidagi "Actions" bo'limidan qo'lda ham ishga tushirish mumkin.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitni tayyorlash
        env:
          KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "✅ Kalit to'g'ri o'qildi"

      - name: Serverga ulanib yangilash
        env:
          HOST: ${{ secrets.DO_HOST }}
          USER_NAME: ${{ secrets.DO_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              "$USER_NAME@$(echo "$HOST" | tr -d ' \r\n')" \
              "cd /root/Birinchi-Yordam-bot && git fetch origin main && git reset --hard origin/main && bash deploy.sh"
