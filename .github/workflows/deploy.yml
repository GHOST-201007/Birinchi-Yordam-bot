name: DigitalOcean'ga deploy

# main branch'ga har push qilinganda server avtomatik yangilanadi.
# GitHub sahifasidagi "Actions" bo'limidan qo'lda ham ishga tushirish mumkin.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Serverga ulanib yangilash
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /root/Birinchi-Yordam-bot
            git fetch origin main && git reset --hard origin/main
            bash deploy.sh
